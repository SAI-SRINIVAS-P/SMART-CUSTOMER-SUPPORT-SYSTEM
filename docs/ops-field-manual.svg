  <rect x="541" y="29" width="104" height="17" rx="4" fill="#15313b"/><text x="593" y="41" text-anchor="middle" fill="#94f0dd">MYSQL + AI</text>
  <path d="M651 37H691" stroke="url(#routeLine)" stroke-width="2"/><path d="M686 33L692 37L686 41" stroke="#86e8eb" stroke-width="2" fill="none"/>
  <rect x="698" y="29" width="89" height="17" rx="4" fill="#3a274a"/><text x="742" y="41" text-anchor="middle" fill="#ffd2f4">REPLY</text>
