<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="312" viewBox="0 0 1200 312" role="img" aria-labelledby="t d">
<title id="t">SMART-CUSTOMER-SUPPORT-SYSTEM · Support Operations Field Manual</title>
<desc id="d">A custom control-room banner with a shimmer title, route trace, pulsing status lights, and a radar sweep.</desc>
<defs>
 <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b19"/><stop offset=".48" stop-color="#121b32"/><stop offset="1" stop-color="#21113c"/></linearGradient>
 <pattern id="microgrid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#5e7ab5" stroke-opacity=".13" fill="none"/><circle cx="0" cy="0" r="1" fill="#6f8bd0" fill-opacity=".22"/></pattern>
 <linearGradient id="sweep" x1="-920" y1="0" x2="-220" y2="0" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#67e8f9"/><stop offset=".32" stop-color="#c4b5fd"/><stop offset=".48" stop-color="#fff"/><stop offset=".72" stop-color="#67e8f9"/><stop offset="1" stop-color="#818cf8"/>
  <animate attributeName="x1" values="-920;1200;-920" dur="5.8s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="-220;1900;-220" dur="5.8s" repeatCount="indefinite"/>
 </linearGradient>
 <linearGradient id="routeLine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#70f0e0"/><stop offset=".52" stop-color="#61d8ff"/><stop offset="1" stop-color="#b49cff"/></linearGradient>
 <radialGradient id="radarGlow"><stop stop-color="#48e5ff" stop-opacity=".18"/><stop offset="1" stop-color="#48e5ff" stop-opacity="0"/></radialGradient>
 <filter id="textGlow" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="312" rx="22" fill="url(#night)"/>
