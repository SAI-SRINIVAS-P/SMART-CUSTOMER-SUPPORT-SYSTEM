<path d="M52 194H130" stroke="#6eeaff" stroke-width="4" stroke-linecap="round"><animate attributeName="d" values="M52 194H130;M52 194H790;M52 194H130" dur="4.8s" repeatCount="indefinite"/></path>
<circle cx="130" cy="194" r="4" fill="#92f2ff"><animate attributeName="cx" values="52;790;52" dur="4.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;1;.35" dur="1.2s" repeatCount="indefinite"/></circle>
