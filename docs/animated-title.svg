<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="245" viewBox="0 0 1100 245" role="img" aria-labelledby="title desc">
<title id="title">SMART-CUSTOMER-SUPPORT-SYSTEM</title><desc id="desc">Animated graphical banner for the customer-support project.</desc>
