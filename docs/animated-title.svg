<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
<title id="title">SMART-CUSTOMER-SUPPORT-SYSTEM</title>
<desc id="desc">Animated title card with a moving color sweep on the project name, orbiting network graphics, pulsing nodes, and an animated progress line.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d22"/><stop offset=".52" stop-color="#17183d"/><stop offset="1" stop-color="#2c1553"/></linearGradient>
 <linearGradient id="titleGradient" x1="-800" y1="0" x2="-100" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#b4a1ff"/><stop offset=".28" stop-color="#71ecff"/><stop offset=".55" stop-color="#ffffff"/><stop offset=".78" stop-color="#8ceeff"/><stop offset="1" stop-color="#a68dff"/><animate attributeName="x1" values="-800;1400;-800" dur="6s" repeatCount="indefinite"/><animate attributeName="x2" values="-100;2100;-100" dur="6s" repeatCount="indefinite"/></linearGradient>
 <radialGradient id="orb"><stop stop-color="#73edff" stop-opacity=".25"/><stop offset="1" stop-color="#8a63ff" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="34" patternUnits="userSpaceOnUse"><path d="M40 0H0V34" fill="none" stroke="#7891e5" stroke-opacity=".13"/></pattern>
 <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="3.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="titleClip"><rect x="48" y="47" width="1100" height="82"/></clipPath>
</defs>
<rect width="1200" height="270" rx="25" fill="url(#bg)"/><rect width="1200" height="270" rx="25" fill="url(#grid)"/><circle cx="1010" cy="132" r="220" fill="url(#orb)"/>
<g fill="none" stroke="#6c83d8" stroke-opacity=".55" stroke-width="1.5">
 <ellipse cx="1015" cy="125" rx="152" ry="105"><animateTransform attributeName="transform" type="rotate" from="0 1015 125" to="360 1015 125" dur="18s" repeatCount="indefinite"/></ellipse>
 <ellipse cx="1015" cy="125" rx="112" ry="154" stroke="#4edfff" stroke-opacity=".5"><animateTransform attributeName="transform" type="rotate" from="46 1015 125" to="406 1015 125" dur="23s" repeatCount="indefinite"/></ellipse>
 <path d="M900 65L955 42L1009 77L1065 44L1123 88L1104 151L1046 203L981 174L930 126Z"/><path d="M900 65L981 174M955 42L1046 203M1009 77L1104 151M1065 44L981 174M1123 88L1046 203"/>
</g>
<g fill="#6fe8ff" filter="url(#glow)">
 <circle cx="900" cy="65" r="4"><animate attributeName="r" values="3;7;3" dur="1.8s" repeatCount="indefinite"/></circle>
 <circle cx="955" cy="42" r="4"><animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite"/></circle>
 <circle cx="1009" cy="77" r="4"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
 <circle cx="1065" cy="44" r="4"><animate attributeName="r" values="3;7;3" dur="1.9s" repeatCount="indefinite"/></circle>
 <circle cx="1123" cy="88" r="4"><animate attributeName="r" values="4;8;4" dur="2.3s" repeatCount="indefinite"/></circle>
 <circle cx="1104" cy="151" r="4"><animate attributeName="r" values="3;7;3" dur="2.2s" repeatCount="indefinite"/></circle>
 <circle cx="1046" cy="203" r="4"><animate attributeName="r" values="4;8;4" dur="2.6s" repeatCount="indefinite"/></circle>
 <circle cx="981" cy="174" r="4"><animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/></circle>
 <circle cx="930" cy="126" r="4"><animate attributeName="r" values="4;8;4" dur="2.1s" repeatCount="indefinite"/></circle>
</g>
<g clip-path="url(#titleClip)">
 <text x="50" y="103" font-family="Segoe UI,Arial,sans-serif" font-size="39" font-weight="800" letter-spacing=".15" fill="#d7e5ff" opacity=".25">SMART-CUSTOMER-SUPPORT-SYSTEM</text>
 <text x="50" y="103" font-family="Segoe UI,Arial,sans-serif" font-size="39" font-weight="800" letter-spacing=".15" fill="url(#titleGradient)" filter="url(#glow)">SMART-CUSTOMER-SUPPORT-SYSTEM</text>
</g>
<text x="52" y="142" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#72e9ff">CUSTOMER CARE  /  ORDER INSIGHTS  /  INTELLIGENT AUTOMATION</text>
<text x="52" y="169" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#d4dcff">A local-first full-stack support workspace</text>
